<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <script>
    var nome = window.prompt("Qual e o seu nome?")
    document.writeln(`Ola ${nome}! seu nome tem ${nome.length} letra</br>`) 
    document.write(`Seu nome em Maiusculas ${nome.toUpperCase()}</br>`)
    document.write(`o seu nme em menusculo ${nome.toLocaleLowerCase()}`)
  </script>  
</body>
</html>
