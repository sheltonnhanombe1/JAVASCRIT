<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
</head>
<style>
    div#area{
        font: 20px arial;
        background-color: green;
        color: white;
        width: 200px;
        height: 200px;
        line-height: 200px;
        text-align: center;
    }
</style>
<body>
   <div id="area">
    interaja...
</div>

<script>
       var a = document.getElementById(`area`)
    a.addEventListener(`click`,clicar)
    a.addEventListener(`mouseenter`,entrar)
    a.addEventListener(`mouseout`,sair)
    function clicar(){
        a.innerText = `Clicou`
        a.style.background= `red`
    }
    function entrar(){
        a.innerText = `entrou`
        
    }
    function sair(){
        a.innerText = `sair`
        a.style.background=`green`
    }

   </script> 
</body>
</html>
