<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operador Relacional</title>
    <style>
        body{
            background-color: rgb(7, 118, 169);
        }
        h1{
            text-align: center;  
            border: black;
        }
        button{
            background-color: rgb(16, 153, 44);
            color: white;
            width: 150px;
            height: 50px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <h1>Operador Relacional</h1>
    <button onclick="
        var idade = 18
        var saldo = 500
        var senha = 1234
        var a = 10
        var b = '10'
        console.log(idade > 18)
        console.log(saldo <= 500)
        console.log(senha == 1234)
        console.log(idade != 20)
        console.log(saldo >= 1000)
        console.log(a==b)
        console.log(a===b)
        console.log(a!=b)
        console.log(a!==b)
        ">Verificar</button>
</body>
</html>
