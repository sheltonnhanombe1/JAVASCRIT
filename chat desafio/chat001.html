<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butao Interativo</title>
    <style>
        body{
            background-color: rgb(87, 164, 231);
        }
        button{
            background-color: brown;
            width: 150px;
            height: 70px;
            border-radius: 16px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1>botao interativo</h1>
    <script>
        var nome = window.prompt("Qual e o seu nome?")
    </script>
    <button onclick=" alert(`prazer em te conhecer ${nome}`)">Clique Aqui</button>
    
</body>
</html>
